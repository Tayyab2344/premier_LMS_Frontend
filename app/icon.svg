<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Green Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#084230" />
      <stop offset="50%" stop-color="#042e21" />
      <stop offset="100%" stop-color="#021b14" />
    </linearGradient>

    <!-- Metallic Gold Gradient for Shield and Icons -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Light Gold Metallic Gradient -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <radialGradient id="shield-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#074431" />
      <stop offset="70%" stop-color="#03261b" />
      <stop offset="100%" stop-color="#01150e" />
    </radialGradient>

    <!-- Nib Gold Gradient -->
    <linearGradient id="nib-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="105" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="105" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Shield Group -->
  <g filter="url(#drop-shadow)">
    <!-- Outer Shield Frame -->
    <path d="M 256 68 
             C 294 98, 350 118, 402 122 
             C 406 242, 384 345, 256 440 
             C 128 345, 106 242, 110 122 
             C 162 118, 218 98, 256 68 Z"
          fill="url(#shield-bg)"
          stroke="url(#gold-grad)"
          stroke-width="11"
          stroke-linejoin="round" />

    <!-- Inner Shield Gold Line -->
    <path d="M 256 86 
             C 289 112, 340 130, 388 134 
             C 392 238, 372 330, 256 420 
             C 140 330, 120 238, 124 134 
             C 172 130, 223 112, 256 86 Z"
          fill="none"
          stroke="url(#gold-light)"
          stroke-width="3.5"
          stroke-opacity="0.95" />
  </g>

  <!-- Globe Grid at Base -->
  <g stroke="url(#gold-grad)" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 160 380 A 130 130 0 0 1 352 380" stroke-width="3" />
    <path d="M 178 358 A 120 70 0 0 1 334 358" />
    <path d="M 200 338 A 110 40 0 0 1 312 338" />
    <path d="M 256 300 L 256 425" stroke-width="2" />
    <path d="M 220 315 C 235 340, 235 385, 220 412" />
    <path d="M 292 315 C 277 340, 277 385, 292 412" />
    <path d="M 188 340 C 210 360, 210 395, 192 408" />
    <path d="M 324 340 C 302 360, 302 395, 320 408" />
  </g>

  <!-- Left Symbol: Scale of Justice -->
  <g transform="translate(140, 230)" stroke="url(#gold-grad)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="28" cy="10" r="3.5" fill="url(#gold-grad)" />
    <line x1="28" y1="13.5" x2="28" y2="50" stroke-width="3.5" />
    <line x1="18" y1="50" x2="38" y2="50" stroke-width="4" />
    <path d="M 4 22 C 14 18, 42 18, 52 22" stroke-width="3.5" />
    <line x1="4" y1="22" x2="-2" y2="40" stroke-width="1.8" />
    <line x1="4" y1="22" x2="10" y2="40" stroke-width="1.8" />
    <path d="M -6 40 C -2 47, 10 47, 14 40 Z" fill="url(#gold-grad)" stroke-width="1" />
    <line x1="52" y1="22" x2="46" y2="40" stroke-width="1.8" />
    <line x1="52" y1="22" x2="58" y2="40" stroke-width="1.8" />
    <path d="M 42 40 C 46 47, 58 47, 62 40 Z" fill="url(#gold-grad)" stroke-width="1" />
  </g>

  <!-- Right Symbol: Abacus -->
  <g transform="translate(305, 238)">
    <rect x="0" y="0" width="54" height="48" rx="8" fill="none" stroke="url(#gold-grad)" stroke-width="4" />
    <line x1="6" y1="12" x2="48" y2="12" stroke="url(#gold-grad)" stroke-width="2" />
    <line x1="6" y1="24" x2="48" y2="24" stroke="url(#gold-grad)" stroke-width="2" />
    <line x1="6" y1="36" x2="48" y2="36" stroke="url(#gold-grad)" stroke-width="2" />
    <circle cx="14" cy="12" r="3.5" fill="url(#gold-grad)" />
    <circle cx="23" cy="12" r="3.5" fill="url(#gold-grad)" />
    <circle cx="40" cy="12" r="3.5" fill="url(#gold-grad)" />
    <circle cx="14" cy="24" r="3.5" fill="url(#gold-grad)" />
    <circle cx="31" cy="24" r="3.5" fill="url(#gold-grad)" />
    <circle cx="40" cy="24" r="3.5" fill="url(#gold-grad)" />
    <circle cx="14" cy="36" r="3.5" fill="url(#gold-grad)" />
    <circle cx="23" cy="36" r="3.5" fill="url(#gold-grad)" />
    <circle cx="32" cy="36" r="3.5" fill="url(#gold-grad)" />
  </g>

  <!-- Center Emblem: Stylized Capital 'P' + Pillar + Nib -->
  <g filter="url(#drop-shadow)">
    <!-- White 'P' Loop -->
    <path d="M 205 138 
             L 285 138 
             C 328 138, 352 158, 352 190 
             C 352 222, 328 242, 285 242 
             L 248 242 
             L 248 138 Z" 
          fill="#FFFFFF" 
          stroke="url(#gold-grad)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Inner P Hole -->
    <path d="M 252 165 
             L 282 165 
             C 302 165, 314 174, 314 190 
             C 314 206, 302 215, 282 215 
             L 252 215 Z" 
          fill="url(#shield-bg)" 
          stroke="url(#gold-grad)" 
          stroke-width="2.5" />

    <!-- Pillar Stem (Column) -->
    <rect x="200" y="132" width="46" height="12" rx="3" fill="#FFFFFF" stroke="url(#gold-grad)" stroke-width="3" />
    <rect x="196" y="142" width="54" height="8" rx="2" fill="url(#gold-grad)" />

    <rect x="204" y="148" width="38" height="150" fill="#FFFFFF" stroke="url(#gold-grad)" stroke-width="4" />
    
    <line x1="213" y1="152" x2="213" y2="294" stroke="#1e293b" stroke-width="2.5" />
    <line x1="223" y1="152" x2="223" y2="294" stroke="#1e293b" stroke-width="2.5" />
    <line x1="233" y1="152" x2="233" y2="294" stroke="#1e293b" stroke-width="2.5" />

    <rect x="196" y="294" width="54" height="8" rx="2" fill="url(#gold-grad)" />
    <rect x="200" y="300" width="46" height="10" rx="2" fill="#FFFFFF" stroke="url(#gold-grad)" stroke-width="3" />

    <!-- Fountain Pen Nib -->
    <path d="M 204 310 
             L 242 310 
             L 230 354 
             L 223 374 
             L 216 354 Z" 
          fill="url(#nib-grad)" 
          stroke="url(#gold-light)" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <circle cx="223" cy="336" r="3.5" fill="#03261b" stroke="url(#gold-light)" stroke-width="1" />
    <line x1="223" y1="339.5" x2="223" y2="372" stroke="#03261b" stroke-width="1.8" />
  </g>
</svg>
